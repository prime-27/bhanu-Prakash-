<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Trails</title>
<meta name="robots" content="noindex">
<style>
  html,body{margin:0;height:100%;background:#04050a;color:#f1eee6;font:15px/1.5 system-ui,sans-serif;overflow:hidden}
  #sky{position:fixed;inset:0;width:100%;height:100%;display:block}
  .panel{position:fixed;right:16px;bottom:16px;width:min(300px,calc(100% - 32px));background:rgba(5,7,15,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(190,200,235,.18);border-radius:12px;padding:14px 16px;box-sizing:border-box}
  .panel h1{font-size:15px;margin:0 0 2px;font-weight:600}.panel p{margin:0 0 10px;color:#9aa1bb;font-size:12.5px}
  label{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:#c9c9d6;margin-top:8px}
  input[type=range]{width:100%;accent-color:#ffc27a}
  .row{display:flex;gap:14px;margin-top:10px}.row label{margin:0;justify-content:flex-start;align-items:center;gap:6px}
  code{display:block;margin-top:10px;font-size:11px;color:#ffc27a;white-space:pre-wrap;word-break:break-all;background:rgba(0,0,0,.35);padding:8px;border-radius:6px}
  button{all:unset;cursor:pointer;font-size:11.5px;color:#9aa1bb;margin-top:6px}button:hover{color:#f1eee6}
  .hide .body{display:none}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="panel" id="panel">
  <h1>Star trails</h1><p>Stars circling the pole star, from stargazinghyderabad.com.</p>
  <div class="body">
    <label>Speed <b id="vs">0.12</b></label><input id="speed" type="range" min="0" max="1" step=".01" value=".12">
    <label>Trail length <b id="vt">0.75</b></label><input id="trail" type="range" min="0" max="1" step=".01" value=".75">
    <div class="row"><label><input id="mw" type="checkbox" checked> Milky Way</label><label><input id="hz" type="checkbox" checked> Hillside</label></div>
    <code id="code"></code>
  </div>
  <button type="button" id="toggle">Hide panel</button>
</div>
<script src="star-trails.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let opts = { speed: .12, trail: .75, milkyWay: true, horizon: true }, sky;
  const start = () => { sky && sky.stop(); sky = StarTrails($("sky"), Object.assign({}, opts)); show(); };
  const show = () => { $("vs").textContent = opts.speed; $("vt").textContent = opts.trail;
    $("code").textContent = `<canvas id="sky" style="position:fixed;inset:0;width:100%;height:100%;z-index:-1"></canvas>\n<script src="star-trails.js"><\/script>\n<script>StarTrails(document.getElementById("sky"), ${JSON.stringify(opts)});<\/script>`; };
  $("speed").oninput = e => { opts.speed = +e.target.value; sky.set("speed", opts.speed); show(); };
  $("trail").oninput = e => { opts.trail = +e.target.value; sky.set("trail", opts.trail); show(); };
  $("mw").onchange = e => { opts.milkyWay = e.target.checked; start(); };
  $("hz").onchange = e => { opts.horizon = e.target.checked; sky.set("horizon", opts.horizon); show(); };
  $("toggle").onclick = () => { const h = $("panel").classList.toggle("hide"); $("toggle").textContent = h ? "Show panel" : "Hide panel"; };
  start();
</script>
</body>
</html>
